<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>גלריה דיגיטלית · יוסף חלפה</title>
    <meta name="description" content="אמנות דיגיטלית מאת יוסף חלפה - אוספי PELEH, שני עצים בלב, וגן המבוכה">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="notice">אב־טיפוס מקומי לתצוגה בלבד · כל המחירים והמוצרים הם לדוגמה</div>
    
    <header>
        <a class="logo" href="/">
            <span class="w">פלא</span>
            <div class="mk"></div>
            <span class="en">YOSEF KHALFA</span>
        </a>
        <nav id="main-nav">
            <a href="/">גלריה</a>
            <span id="nav-user-info" class="hidden"></span>
            <a href="/cart.html">סל (<span id="cart-count">0</span>)</a>
            <button id="auth-btn" class="btn-primary">התחבר</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>אמנות דיגיטלית · יוסף חלפה</h1>
            <p>שלושה אוספים · PELEH, שני עצים בלב, גן המבוכה</p>
        </section>

        <section class="filters">
            <div class="filter-group">
                <label>אוסף</label>
                <select id="collection-filter">
                    <option value="">כל האוספים</option>
                    <option value="עץ הדעת">PELEH · פלא</option>
                    <option value="עץ החיים">שני עצים בלב</option>
                    <option value="השתקפות ב-AI">גן המבוכה</option>
                </select>
            </div>
        </section>

        <section class="grid" id="artworks-grid">
            <!-- Products will be loaded here -->
        </section>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2 id="auth-modal-title">התחברות</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label>אימייל</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="form-group">
                    <label>סיסמה (לפחות 6 תווים)</label>
                    <input type="password" id="auth-password" minlength="6" required>
                </div>
                <div id="register-fields" class="hidden">
                    <div class="form-group">
                        <label>שם משתמש</label>
                        <input type="text" id="auth-username">
                    </div>
                    <div class="form-group">
                        <label>שם מלא</label>
                        <input type="text" id="auth-name">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="auth-toggle" class="btn-secondary">אין לך חשבון? הירשם</button>
                    <button type="submit" class="btn-primary" id="auth-submit">התחבר</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
